<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BC0BE"/>
      <stop offset="100%" stop-color="#6FFFE9"/>
    </linearGradient>
    <clipPath id="buoyClip">
      <circle cx="16" cy="18" r="7.5"/>
    </clipPath>
  </defs>

  <!-- mast + flag -->
  <rect x="15.3" y="4.5" width="1.4" height="6" fill="#A7C957" rx="0.5"/>
  <path d="M16.7 5 L23 7.2 L16.7 9.4 Z" fill="#6FFFE9"/>

  <!-- buoy body -->
  <g clip-path="url(#buoyClip)">
    <rect x="8.5" y="10.5" width="15" height="15" fill="#A7C957"/>
    <rect x="8.5" y="17" width="15" height="2.6" fill="#0B132B"/>
  </g>
  <circle cx="16" cy="18" r="7.5" fill="none" stroke="#0B132B" stroke-width="1"/>

  <!-- waves -->
  <path d="M4 25.5 Q8 22.5 12 25.5 T20 25.5 T28 25.5" fill="none" stroke="url(#wave)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M3 29.5 Q7.5 26.5 12 29.5 T21 29.5 T30 29.5" fill="none" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
